<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="icon" href="{{ url_for('static', filename='assets/img/icon.png') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 220px;
      height: 100vh;
      background-color: #2c3e50;
      color: white;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
    }
    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .sidebar a {
      padding: 15px 20px;
      text-decoration: none;
      color: white;
      display: block;
      transition: background 0.3s;
    }
    .sidebar a:hover {
      background-color: #34495e;
    }
    .main {
      margin-left: 220px;
      padding: 20px;
    }
    .component {
      display: none;
    }
    .component.active {
      display: block;
    }
    .logout-btn {
      margin-top: auto;
      padding: 15px 20px;
      background-color: #e74c3c;
      color: white;
      text-align: center;
      cursor: pointer;
    }
    /* Main dashboard card style */
.component {
  background: #f9fafb;
  padding: 2rem;
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.05);
  font-family: 'Poppins', sans-serif;
}

/* Button styles */
.filter-btn {
  background: #1d4ed8;
  color: white;
  padding: 8px 16px;
  border-radius: 8px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: background 0.3s ease;
}

.filter-btn:hover {
  background: #2563eb;
}

/* Dashboard grid layout */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 2rem;
  margin-bottom: 2.5rem;
}

/* Chart card styling */
.chart-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 1rem;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Only apply this to pie charts */
.pie-chart {
  width: 220px !important;
  height: 220px !important;
  background: transparent;
  border-radius: 16px;
}

/* Line chart styles remain untouched */

/* Header styles */
h2 {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 1.5rem;
  color: #1f2937;
}

h3 {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 1rem;
  color: #111827;
  text-align: center;
}

/* Responsive */
@media (max-width: 768px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .pie-chart {
    width: 180px !important;
    height: 180px !important;
  }

  .filter-btn {
    padding: 6px 12px;
    font-size: 0.9rem;
  }

  h2 {
    font-size: 1.5rem;
  }

  h3 {
    font-size: 1.1rem;
  }
}
  </style>
</head>
<body>
  <div class="sidebar">
<h2 style="color: #ffffff; font-size: 1.5rem;">Tecko Admin</h2>
    <a href="#" onclick="showComponent('product')">📦 Products</a>
    <a href="#" onclick="showComponent('analytics')">📊 Analytics</a>
    <!-- Add this to your sidebar -->
<a href="#" onclick="showComponent('orders')">📦 Orders</a>
<!-- Add this in your main content -->
<style>
.kanban-board {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}
.kanban-column {
  flex: 1;
  background-color: #f1f1f1;
  padding: 10px;
  border-radius: 8px;
  min-height: 300px;
}
.kanban-column h3 {
  text-align: center;
}
.order-card {
  background: white;
  border: 1px solid #ccc;
  padding: 10px;
  margin: 8px;
  border-radius: 8px;
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
  font-size: 14px;
  line-height: 1.4;
}

</style>



    <div class="logout-btn" onclick="location.href='{{ url_for('logout') }}'">🚪 Logout</div>
  </div>

  <div class="main">

    <div id="product" class="component active">
      <h2>Manage Products</h2>
      {% include 'admin_products.html' %} 
    </div>

    <div id="analytics" class="component">
      <h2>📊 Sales & Profit Analytics</h2>

    <div class="flex justify-end space-x-4 mb-10">
  <button class="filter-btn" data-range="today">Today</button>
  <button class="filter-btn" data-range="month">This Month</button>
  <button class="filter-btn" data-range="overall">Overall</button>
  <button class="filter-btn" data-range="custom">Custom</button>
</div>


    <div class="grid">
  <div class="chart-card">
    <h3>Top Selling Products</h3>
    <canvas id="topSellingChart" class="pie-chart"></canvas>
  </div>
  <div class="chart-card">
    <h3>Product-wise Profit</h3>
    <canvas id="profitChart" class="pie-chart"></canvas>
  </div>
    <div class="chart-card">
    <h3>Profit by Category</h3>
    <canvas id="categoryProfitChart" class="pie-chart"></canvas>
  </div>
  
</div>

<h3 class="text-center">📈 Sales Over Time</h3>
<canvas id="salesLineChart"></canvas> 

    </div>
    <div id="orders" class="component">
  <h2>Manage Orders</h2>
  <div class="kanban-board">
    <div class="kanban-column" id="pending">
      <h3>Pending</h3>
    </div>
    <div class="kanban-column" id="shipped">
      <h3>Shipped</h3>
    </div>
    <div class="kanban-column" id="delivered">
      <h3>Delivered</h3>
    </div>
  </div>
</div>

  </div>
<script>
const orderData = {{ orders | tojson }}; // Get from Flask

function renderKanban() {
  const statuses = ['Pending', 'Shipped', 'Delivered'];
  statuses.forEach(status => {
    const column = document.getElementById(status.toLowerCase());
    column.innerHTML = `<h3>${status}</h3>`;
    const filtered = orderData.filter(o => o.status === status);
    
    filtered.forEach(order => {
      const card = document.createElement('div');
      card.className = 'order-card';
      card.draggable = true;
      card.id = 'order-' + order.order_id;

      card.innerHTML = `
        <strong>${order.title}</strong> - ₹${order.total_cost}<br/>
        🧮 Quantity: ${order.quantity} ${order.unit}<br/>
        📦 Order ID: ${order.order_id}<br/>
        👤 ${order.username} (${order.mobile})<br/>
        🏠 ${order.address_line}, ${order.city}, ${order.state} - ${order.pincode}
      `;

      card.ondragstart = e => e.dataTransfer.setData('text/plain', order.order_id);
      column.appendChild(card);
    });
  });
}


document.querySelectorAll('.kanban-column').forEach(col => {
  col.ondragover = e => e.preventDefault();

  col.ondrop = async e => {
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    const newStatus = col.id.charAt(0).toUpperCase() + col.id.slice(1); // e.g. 'pending' => 'Pending'

    console.log(`🔁 Dragged order ID: ${id} to column: ${newStatus}`);

    try {
      const response = await fetch(`/update_order_status/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });

      const result = await response.json();

      if (response.ok) {
        console.log(`✅ Order ${id} updated successfully:`, result);
        const order = orderData.find(o => o.order_id == id);
        if (order) {
          order.status = newStatus;
          renderKanban();
        } else {
          console.warn(`⚠️ Order ${id} not found in local data`);
        }
      } else {
        console.error(`❌ Server error updating order ${id}:`, result.error || result.message);
        alert(`Failed to update status for order ${id}.`);
      }
    } catch (err) {
      console.error(`❌ Network error:`, err);
      alert("Network error occurred. Please try again.");
    }
  };
});

document.addEventListener('DOMContentLoaded', renderKanban);
</script>
  <script>
    
    function showComponent(id) {
      const components = document.querySelectorAll('.component');
      components.forEach(c => c.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
  <script>
    let topSellingChart, profitChart, salesLineChart, categoryProfitChart;

function fetchAnalytics(range = 'overall') {
  fetch(`/admin/analytics_data`)
    .then(res => res.json())
    .then(data => {
      const labels = data.sales_per_product.map(p => p.title);
      const quantities = data.sales_per_product.map(p => p.quantity || 0);
      const profits = data.sales_per_product.map(p => p.total_sales);

      const lineLabels = data.sales_over_time.map(d => d.date);
      const lineData = data.sales_over_time.map(d => d.total);

      const categoryLabels = data.profit_by_category.map(c => c.category);
      const categoryProfits = data.profit_by_category.map(c => c.total_profit);

      if (topSellingChart) topSellingChart.destroy();
      if (profitChart) profitChart.destroy();
      if (salesLineChart) salesLineChart.destroy();
      if (categoryProfitChart) categoryProfitChart.destroy();

      const ctx1 = document.getElementById('topSellingChart').getContext('2d');
      topSellingChart = new Chart(ctx1, {
        type: 'pie',
        data: {
          labels,
          datasets: [{
            label: 'Units Sold',
            data: quantities,
            backgroundColor: ['#f87171', '#60a5fa', '#34d399', '#facc15', '#c084fc']
          }]
        },
        options: {
          plugins: {
            title: {
              display: true,
              text: 'Units Sold per Product'
            }
          }
        }
      });

      const ctx2 = document.getElementById('profitChart').getContext('2d');
      profitChart = new Chart(ctx2, {
        type: 'pie',
        data: {
          labels,
          datasets: [{
            label: 'Total Profit ₹',
            data: profits,
            backgroundColor: ['#fb923c', '#a78bfa', '#10b981', '#3b82f6', '#f59e0b']
          }]
        },
        options: {
          plugins: {
            title: {
              display: true,
              text: 'Profit per Product'
            }
          }
        }
      });

      const ctx3 = document.getElementById('salesLineChart').getContext('2d');
      salesLineChart = new Chart(ctx3, {
        type: 'line',
        data: {
          labels: lineLabels,
          datasets: [{
            label: 'Daily Sales ₹',
            data: lineData,
            borderColor: '#4ade80',
            tension: 0.4,
            fill: true,
            backgroundColor: 'rgba(74,222,128,0.1)'
          }]
        },
        options: {
          plugins: {
            title: {
              display: true,
              text: 'Sales Over Time'
            }
          },
          responsive: true
        }
      });

      const ctx4 = document.getElementById('categoryProfitChart').getContext('2d');
      categoryProfitChart = new Chart(ctx4, {
        type: 'pie',
        data: {
          labels: categoryLabels,
          datasets: [{
            label: 'Profit by Category ₹',
            data: categoryProfits,
            backgroundColor: ['#fcd34d', '#fdba74', '#f472b6', '#818cf8', '#5eead4']
          }]
        },
        options: {
          plugins: {
            title: {
              display: true,
              text: 'Profit by Category'
            }
          }
        }
      });
    });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const range = btn.dataset.range;
    fetchAnalytics(range);
  });
});

fetchAnalytics();

  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

</body>
</html>
