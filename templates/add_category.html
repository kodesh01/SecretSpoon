<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Category</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --first-color: hsl(176, 88%, 27%);       /* Dark green */
      --first-color-alt: hsl(129, 44%, 94%);   /* Light green background */
      --text-color: hsl(154, 13%, 32%);
      --body-font: 'Lato', sans-serif;
      --transition: 0.3s ease-in-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--body-font);
      background-color: var(--first-color-alt);
      color: var(--text-color);
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h2 {
      color: var(--first-color);
      text-align: center;
      margin-bottom: 1.5rem;
      font-family: 'Spartan', sans-serif;
    }

    form {
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      transition: var(--transition);
    }

    input[type="text"],
    input[type="file"],
    input[type="submit"] {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      font-size: 1rem;
      border: 1px solid var(--first-color);
      border-radius: 5px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="file"]:focus {
      outline: none;
      border-color: darkgreen;
    }

    input[type="submit"] {
      background-color: var(--first-color);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    input[type="submit"]:hover {
      background-color: #136c52;
    }
  </style>
</head>
<body>
  <form method="POST" enctype="multipart/form-data">
    <h2>Add Category</h2>
    <label for="name">Name:</label>
    <input type="text" name="name" id="name" required>

    <label for="image">Image:</label>
    <input type="file" name="image" id="image" accept="image/*" required>

    <input type="submit" value="Add">
  </form>
</body>
</html>
